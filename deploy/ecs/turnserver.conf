# 小新视频通话的 TURN 中继（coturn），装在 ECS 47.116.13.227。由 deploy/ecs.sh 渲染：
#   @PUBLIC_IP@ @PRIVATE_IP@ 换成实际地址，@TURN_SECRET@ 换成 .env 里的 TURN_SECRET（只在 ECS 上落地，权限 600）。
# 用短期凭证（use-auth-secret）：中枢每次通话签一个 10 分钟有效的用户名/密码，ECS 上不存静态账号。
# 带宽只有 5 Mbps：一路通话每方向限 1.2 Mbps 由客户端控制；这里再兜一道总量和单会话上限。

listening-port=3478
listening-ip=@PRIVATE_IP@
relay-ip=@PRIVATE_IP@
external-ip=@PUBLIC_IP@/@PRIVATE_IP@
min-port=49160
max-port=49200

realm=xiaoxin
use-auth-secret
static-auth-secret=@TURN_SECRET@
fingerprint

# 不做 TLS（5349）：没有正式证书；家长手机和 pad 走 UDP/TCP 3478 足够，媒体本身是 DTLS-SRTP 加密的
no-tls
no-dtls
no-cli
no-multicast-peers

# 配额按「分配数」算，不是 Mbps：浏览器一次通话每端会同时申请 UDP、TCP 各几个分配（ICE 并行试），
# 一次通话十来个。原来 total-quota=4 + bps-capacity 一开就 486 Quota Reached（2026-10-31 e2e 实测）。
# 这里留 40 个分配（同时 3 路通话也够），单个分配限 2 Mbps（max-bps 单位是字节/秒）。
# 总带宽不在这里卡：客户端每方向限 1.2 Mbps，中枢同时只放一路通话（docs/architecture.md 10 节 #2）。
total-quota=40
user-quota=20
max-bps=262144

# 只许中继到公网，不许借它打 ECS 自己和内网（防 SSRF）
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255

# 例外：两端都走中继时，coturn 把对端的公网中继地址换回自己的内网地址再转发，这一个地址得放行（只放它自己）
allowed-peer-ip=@PRIVATE_IP@

log-file=/var/log/turnserver/turn.log
simple-log
