# 小新视频通话的 TURN 中继（coturn），装在 ECS 47.116.13.227。由 deploy/ecs.sh 渲染：
#   @PUBLIC_IP@ @PRIVATE_IP@ 换成实际地址，@TURN_SECRET@ 换成 .env 里的 TURN_SECRET（只在 ECS 上落地，权限 600）。
# 用短期凭证（use-auth-secret）：中枢每次通话签一个 10 分钟有效的用户名/密码，ECS 上不存静态账号。
# 带宽只有 5 Mbps：一路通话每方向限 1.2 Mbps 由客户端控制；这里再兜一道总量和单会话上限。

listening-port=3478
listening-ip=@PRIVATE_IP@
relay-ip=@PRIVATE_IP@
external-ip=@PUBLIC_IP@/@PRIVATE_IP@
min-port=49160
max-port=49200

realm=xiaoxin
use-auth-secret
static-auth-secret=@TURN_SECRET@
fingerprint

# 不做 TLS（5349）：没有正式证书；家长手机和 pad 走 UDP/TCP 3478 足够，媒体本身是 DTLS-SRTP 加密的
no-tls
no-dtls
no-cli
no-multicast-peers

# 同时最多 4 路中继会话（一次通话 2 路），单路 ≤ 2 Mbps，总量 ≤ 4 Mbps（给 HTTPS / frp 留 1 Mbps）
total-quota=4
user-quota=4
max-bps=262144
bps-capacity=524288

# 只许中继到公网，不许借它打 ECS 自己和内网（防 SSRF）
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255

log-file=/var/log/turnserver/turn.log
simple-log
